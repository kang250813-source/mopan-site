name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install jinja2 qrcode[pil] Pillow

      - name: Build static site
        env:
          BASE_PATH: /
          CUSTOM_DOMAIN: www.mopan.lol
          STATIC_LOCALES: zh,en
          STATIC_MINIFY_HTML: "1"
          # jsDelivr: 国内/手机可达；封面仍在 mopan-covers，不撑爆 mopan-site
          COVER_ASSET_BASE: https://cdn.jsdelivr.net/gh/kang250813-source/mopan-covers@main
        run: python scripts/build_static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
