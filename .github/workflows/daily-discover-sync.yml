name: Daily Site Sync

on:
  schedule:
    # 每天北京时间 10:00（UTC 02:00）
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mopan-site
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: kang250813-source/mopan-sync
          path: mopan-sync
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -q -r mopan-sync/requirements.txt
          pip install -q -r mopan-site/requirements.txt

      - name: Run daily site sync
        env:
          SITE_ROOT: ${{ github.workspace }}/mopan-site
          PUSH_GITHUB: "0"
          BASE_PATH: /
          LINUXDO_PAGES: "3"
          # 与 pages.yml 一致：封面走 jsDelivr，避免写入 /jupan-covers 撑爆仓库
          COVER_ASSET_BASE: https://cdn.jsdelivr.net/gh/kang250813-source/mopan-covers@main
          CUSTOM_DOMAIN: www.mopan.lol
        run: |
          cd mopan-sync
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          chmod +x scripts/daily_site_sync.sh
          ./scripts/daily_site_sync.sh

      - name: Commit and push mopan-site
        working-directory: mopan-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 封面走外部 CDN，不要把 jupan-covers 二进制再提交进仓库
          git add docs data/discover.json data/export data/sync_meta.json
          if git diff --staged --quiet; then
            echo "mopan-site: no changes"
          else
            git commit -m "chore: daily site sync $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Commit and push mopan-sync state
        working-directory: mopan-sync
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discover_sync_state.json
          if git diff --staged --quiet; then
            echo "mopan-sync: no changes"
          else
            git commit -m "chore: daily site sync $(date -u +%Y-%m-%d)"
            git push
          fi
