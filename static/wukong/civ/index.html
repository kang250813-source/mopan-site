<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1226">
  <title>文明之主纪元 - 魔盘游戏</title>
  <base href="/static/wukong/civ/">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070b18; }
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    #civ-canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #civ-toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10; max-width: calc(100vw - 40px); padding: 10px 16px; border: 1px solid #ffcd4c; border-radius: 8px; color: #eaf0ff; background: #1d2748; font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
    #civ-toast.is-visible { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="civ-canvas" aria-label="文明之主纪元"></canvas>
  <div id="civ-toast" role="status" aria-live="polite"></div>
  <script src="web-adapter.js"></script>
  <script>
    window.module = { exports: {} };
  </script>
  <script src="game-core.js"></script>
  <script>
    window.MopanCivCore = window.module.exports;
    window.require = function (path) {
      if (path === './utils/game-core') return window.MopanCivCore;
      throw new Error('Unsupported browser module: ' + path);
    };
  </script>
  <script src="game.js"></script>
</body>
</html>
