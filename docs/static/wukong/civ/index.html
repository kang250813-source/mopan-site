<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0c1226" />
<title>文明之主 · 跨纪元文明模拟</title>
<meta name="description" content="文明之主——从原始村庄到星际帝国，跨越生肖、神兽、修仙、AI、宇宙六大时代的放置养成游戏。" />
<style>
:root{
  --bg:#0c1226;--card:#161e3a;--card2:#1d2748;--line:rgba(255,255,255,.1);
  --ink:#eaf0ff;--muted:#9aa6cc;--accent:#ffcd4c;--accent2:#ff8a3c;
  --good:#5be08a;--era:#8b7bff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);min-height:100vh;
  background:radial-gradient(circle at 50% -10%,#1c2a52 0%,#0c1226 55%,#070b18 100%);
  background-attachment:fixed;display:flex;flex-direction:column;align-items:center;
  padding:14px;-webkit-user-select:none;user-select:none;
}
.app{width:100%;max-width:680px;display:flex;flex-direction:column;flex:1}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;
  background:linear-gradient(180deg,var(--accent),var(--accent2));font-size:20px;color:#1a1206;font-weight:900;box-shadow:0 4px 0 #9c5a12}
.logo b{font-size:17px;letter-spacing:2px;display:block}
.logo small{font-size:10px;letter-spacing:3px;color:var(--muted)}
.top-link{font-size:13px;color:var(--accent);border:1px solid var(--line);padding:6px 13px;border-radius:999px;text-decoration:none}

/* era banner */
.era-banner{background:linear-gradient(135deg,rgba(139,123,255,.3),rgba(40,34,80,.5));
  border:1px solid rgba(139,123,255,.4);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.era-top{display:flex;justify-content:space-between;align-items:center}
.era-name{font-size:18px;font-weight:900;letter-spacing:1px}
.era-name .em{font-size:22px;margin-right:6px}
.era-tier{font-size:12px;color:var(--accent);background:rgba(0,0,0,.3);padding:4px 12px;border-radius:999px}
.era-prog{height:14px;background:rgba(0,0,0,.4);border-radius:999px;margin-top:10px;overflow:hidden;position:relative}
.era-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--era),var(--accent));transition:width .3s}
.era-prog span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:700;text-shadow:0 1px 2px #000}
.era-advance{margin-top:10px}

/* resources */
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-bottom:12px}
.res{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.res .rl{font-size:11px;color:var(--muted)}
.res .rv{font-size:16px;font-weight:900;margin-top:2px}
.res .rr{font-size:10px;color:var(--good);margin-top:1px}

/* big tap */
.tap-zone{text-align:center;margin-bottom:12px}
.tap-core{width:130px;height:130px;border-radius:50%;border:none;cursor:pointer;margin:0 auto;
  display:grid;place-items:center;font-size:64px;
  background:radial-gradient(circle at 40% 35%,rgba(255,205,76,.35),rgba(40,34,80,.7));
  border:2px solid rgba(255,205,76,.5);box-shadow:0 0 40px rgba(255,205,76,.25);transition:transform .07s}
.tap-core:active{transform:scale(.93)}
.tap-hint{font-size:12px;color:var(--muted);margin-top:8px}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--muted);
  border-radius:10px;padding:9px 14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.on{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#1a1206;border-color:var(--accent)}
.tab.locked{opacity:.4;cursor:not-allowed}

.panel{background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:16px;padding:14px;flex:1;min-height:260px}
.panel-title{font-size:14px;color:var(--accent);letter-spacing:2px;margin-bottom:10px;border-left:3px solid var(--accent2);padding-left:10px}
.list{display:flex;flex-direction:column;gap:9px}
.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;
  background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .ico{font-size:26px;text-align:center}
.item .main{min-width:0}
.item .nm{font-size:14px;font-weight:800}
.item .ds{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.item .lv{font-size:11px;color:#6fd0ff}
.buy{background:linear-gradient(180deg,var(--good),#16ad61);color:#06281a;border:none;border-radius:10px;
  padding:9px 13px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 0 #0a6e3c}
.buy:active{transform:translateY(3px);box-shadow:0 1px 0 #0a6e3c}
.buy:disabled{background:#2b334a;color:#8d96ad;box-shadow:none;cursor:not-allowed}
.buy.special{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#1a1206;box-shadow:0 4px 0 #9c5a12}
.build-card{grid-template-columns:40px minmax(0,1fr) minmax(116px,auto)}
.build-action{display:flex;flex-direction:column;align-items:flex-end;gap:7px;min-width:0}
.buy.build-btn{min-width:76px;text-align:center}
.cost-list{display:flex;gap:5px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:188px}
.cost-chip{display:inline-flex;align-items:center;gap:2px;min-width:50px;justify-content:center;
  border-radius:999px;padding:4px 7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);
  color:#cfd8f6;font-size:11px;line-height:1;font-weight:900}
.cost-chip.miss{background:rgba(255,92,92,.12);border-color:rgba(255,92,92,.28);color:#ffb3b3}
.build-action.locked .buy{opacity:.74}
.chosen{border-color:var(--accent);box-shadow:0 0 12px rgba(255,205,76,.3)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;line-height:1.7}

/* overlay */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(6,8,18,.75);backdrop-filter:blur(4px);padding:18px}
.overlay.on{display:flex}
.modal{background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--accent);
  border-radius:20px;padding:24px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{font-size:24px;margin-bottom:6px;background:linear-gradient(90deg,var(--era),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.modal p{font-size:14px;color:#cfd6f0;line-height:1.8;margin-bottom:16px}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-size:17px;font-weight:900;letter-spacing:2px;
  cursor:pointer;font-family:inherit;background:linear-gradient(180deg,var(--accent),var(--accent2));color:#1a1206;
  box-shadow:0 6px 0 #9c5a12,0 12px 22px rgba(0,0,0,.35);margin-top:8px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9c5a12}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);box-shadow:none}
.btn.ghost:active{transform:translateY(2px);box-shadow:none}
.btn.row{margin-top:8px}

.foot{text-align:center;color:#6b7799;font-size:12px;margin:16px 0 30px}
.foot button{background:none;border:none;color:#ff6b6b;cursor:pointer;text-decoration:underline;font-family:inherit;font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);
  border:1px solid var(--accent);color:var(--ink);padding:11px 20px;border-radius:999px;font-size:14px;z-index:90;
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast[hidden]{display:none}
.float{position:absolute;font-weight:900;color:var(--accent);pointer-events:none;animation:fu .9s ease-out forwards;text-shadow:0 2px 5px #000}
@keyframes fu{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px);opacity:0}}
.fusion-note{font-size:11px;color:var(--era);text-align:center;margin-top:8px;font-style:italic}
@media (max-width:560px){
  body{padding:10px}
  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;overflow:visible;padding-bottom:0}
  .tab{min-width:0;padding:9px 4px;border-radius:9px;font-size:13px;text-align:center}
  .item{grid-template-columns:34px minmax(0,1fr);align-items:start;padding:10px}
  .item .ico{font-size:23px}
  .item>.buy{grid-column:1 / -1;justify-self:stretch;width:100%;margin-top:4px;text-align:center;padding:10px 12px}
  .build-card{grid-template-columns:34px minmax(0,1fr)}
  .build-action{grid-column:1 / -1;display:grid;grid-template-columns:1fr auto;align-items:center;margin-top:4px}
  .cost-list{justify-content:flex-start;max-width:none}
  .buy.build-btn{min-width:72px;padding:8px 12px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo"><span class="mark">魔</span><span><b data-i18n="civ.title">文明之主</b><small>魔盘 · 跨纪元文明</small></span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="lang-switch"></span>
      <a class="top-link" href="/game/" data-i18n="common.back_hub">← 游戏大厅</a>
    </div>
  </div>

  <div class="era-banner">
    <div class="era-top">

  <div class="tabs" id="tabs"></div>
  <div class="panel">
    <div class="panel-title" id="panel-title" data-i18n="civ.ui.panel_build">建筑</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
(function(){
var $=function(id){return document.getElementById(id);};

var pick=function(a){return a[Math.floor(Math.random()*a.length)];};

var T=function(k,v){return (window.WukongI18n?window.WukongI18n.t(k,v):k);};
/* localized-name accessors (resolve by id at render time) */
var resName=function(key){return T("civ.res."+key);};

var zName=function(id){return T("civ.zodiac."+id);};
var zDesc=function(id){return T("civ.zodiac_desc."+id);};
var beastName=function(id){return T("civ.beast."+id);};
var techName=function(id){return T("civ.tech."+id);};
var techDesc=function(id){return T("civ.tech_desc."+id);};
var starName=function(id){return T("civ.star."+id);};
var starDesc=function(id){return T("civ.star_desc."+id);};
var evoName=function(ev){return T("civ.evolution."+ev.id+".name")||ev.name;};
var evoDesc=function(ev){return T("civ.evolution."+ev.id+".desc")||ev.desc;};
var dunName=function(id){return T("civ.dungeon."+id);};
var dunDesc=function(id){return T("civ.dungeon_desc."+id);};
var realmName=function(id){return T("civ.realm."+id);};
var rarName=function(r){return T("civ.rarity."+r);};
var eraName=function(i){return T("civ.era."+i+".name");};
var eraIntro=function(i){return T("civ.era."+i+".intro");};
var TIER_KEYS=[
  ["village","town","city","kingdom","empire"],
  ["awaken","clan","alliance","dynasty"],
  ["beast_dawn","tame","legion","beastlord"],
  ["qi_revival","core","nascent","spirit","ascend"],
  ["steam","industry","info","ai_age"],
  ["orbit","colony","dyson","starsea"],
  ["gene_decode","blood_rewrite","species_archive","evolution_court"],
  ["time_seed","timeline","retrocausal","chronolord"],

  ["upload","spirit_net","digital_core","mind_ascend"],
  ["origin_seed","law_weave","world_restart","creator"],
  ["dao_seed","season_law","infinite_loop","dao_fruit"]
];
var tierName=function(eraIdx,tierIdx){var a=TIER_KEYS[eraIdx]||[];return T("civ.tiers."+(a[tierIdx]||a[a.length-1]));};
var fusionNote=function(eraIdx){return eraIdx>=2?T("civ.fusion."+eraIdx):"";};
var rarKey=function(rzh){return rzh==="神话"?"myth":rzh==="传说"?"legend":"epic";};
var buildActionLabel=function(){return (window.WukongI18n&&WukongI18n.getLocale&&WukongI18n.getLocale()!=="zh-CN")?"Build":"建造";};
function toast(m){var e=$("toast");e.textContent=m;e.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){e.hidden=true;},2200);}
function beep(f,d,t,v){try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;beep._c=beep._c||new AC();var c=beep._c;if(c.state==="suspended")c.resume();var n=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=t||"sine";o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(v||.1,n);g.gain.exponentialRampToValueAtTime(.0001,n+(d||.1));o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+(d||.1)+.02);}catch(e){}}
function fmt(n){n=Math.floor(n);if(n<1e4)return ""+n;
  var en=(window.WukongI18n&&WukongI18n.getLocale&&WukongI18n.getLocale()!=="zh-CN");
  if(en){
    if(n<1e6)return (n/1e3).toFixed(n<1e5?1:0)+"K";
    if(n<1e9)return (n/1e6).toFixed(2)+"M";
    if(n<1e12)return (n/1e9).toFixed(2)+"B";
    if(n<1e15)return (n/1e12).toFixed(2)+"T";
    return (n/1e15).toFixed(2)+"Qa";
  }
  if(n<1e8)return (n/1e4).toFixed(n<1e6?1:0)+"万";
  if(n<1e12)return (n/1e8).toFixed(2)+"亿";
  if(n<1e16)return (n/1e12).toFixed(2)+"兆";
  return (n/1e16).toFixed(2)+"京";
}

   {id,era,ico,name,desc,res,base cost,baseProd,growth} */

  // 原始
  {id:"farm", era:0, ico:"🌾", name:"农田",   desc:"产出食物",     res:"food", cost:15,   prod:0.5, growth:1.15},
  {id:"mine", era:0, ico:"⛏️", name:"矿场",   desc:"产出物资",     res:"goods",cost:50,   prod:0.4, growth:1.16},

/* ============ multipliers ============ */
function globalMult(resKey){
  var m=1;
  // zodiac bloodline
  if(G.bloodline){
    var z=ZODIAC.find(function(x){return x.id===G.bloodline;});
    if(z){
      if(z.mult){ if(z.mult.all)m*=(1+z.mult.all); if(z.mult[resKey])m*=(1+z.mult[resKey]); }
    }
  }
  // recruited zodiac (each gives +3% all)
  var rc=Object.keys(G.zodiacRecruited).length;
  m*=(1+rc*0.03);
  // beasts
  var bm=0;
  for(var id in G.beasts){var b=BEASTS.find(function(x){return x.id===id;});if(b)bm+=b.mult*Math.min(G.beasts[id],5);}
  m*=(1+bm);
  // gene evolutions
  for(var e in G.evolutions){
    var ev=EVOLUTIONS.find(function(x){return x.id===e;});
    if(ev&&ev.mult){ if(ev.mult.all)m*=(1+ev.mult.all); if(ev.mult[resKey])m*=(1+ev.mult[resKey]); }
  }
  // cultivation realm
  m*=REALMS[G.realm].mult;
  // techs
  for(var t in G.techs){var tc=TECHS.find(function(x){return x.id===t;});if(tc&&tc.mult){if(!tc.res||tc.res===resKey)m*=(1+tc.mult);}}
  // star projects
  for(var s in G.starProj){var sp=STARPROJ.find(function(x){return x.id===s;});if(sp)m*=(1+sp.mult);}
  return m;
}
function costCut(){
  var c=0;
  if(G.bloodline){var z=ZODIAC.find(function(x){return x.id===G.bloodline;});if(z&&z.costCut)c+=z.costCut;}
  return clamp(c,0,0.5);
}
function tapMult(){
  var m=1;
  if(G.bloodline){var z=ZODIAC.find(function(x){return x.id===G.bloodline;});if(z&&z.tap)m*=(1+z.tap);}
  for(var t in G.techs){var tc=TECHS.find(function(x){return x.id===t;});if(tc&&tc.tap)m*=(1+tc.tap);}
  return m;
}
function offlineMult(){
  var m=0.5; // base 50% offline efficiency
  if(G.bloodline){var z=ZODIAC.find(function(x){return x.id===G.bloodline;});if(z&&z.offline)m+=z.offline;}
  return m;
}

/* building cost & production */
function bCount(id){return G.buildings[id]||0;}
function bCost(b){return Math.floor(b.cost*Math.pow(b.growth,bCount(b.id))*(1-costCut()));}
function buildingCost(b){
  var base=bCost(b),mix=BUILD_COSTS[b.id]||{gold:1},out={};
  for(var k in mix)out[k]=Math.max(1,Math.floor(base*mix[k]));
  return out;
}
function canPay(cost){
  for(var k in cost){if((G.res[k]||0)<cost[k])return false;}
  return true;
}
function payCost(cost){
  if(!canPay(cost))return false;
  for(var k in cost)G.res[k]-=cost[k];
  return true;
}
function costLabel(cost){
  return '<span class="cost-list">'+Object.keys(cost).map(function(k){
    var r=RES.find(function(x){return x.key===k;});
    var miss=(G.res[k]||0)<cost[k];
    return '<span class="cost-chip'+(miss?' miss':'')+'">'+(r?r.ico:"")+fmt(cost[k])+'</span>';
  }).join("")+'</span>';
}
function prodPerSec(){
  var out={food:0,goods:0,gold:0,qi:0,tech:0,star:0,gene:0,time:0,dark:0,mind:0,origin:0,dao:0};
  BUILDINGS.forEach(function(b){
    var n=bCount(b.id);if(!n)return;
    out[b.res]+=b.prod*n;
  });
  // apply multipliers
  for(var k in out){ out[k]*=globalMult(k); }
  return out;
}
function tapValue(){
  // tap gives gold scaled by era and tap mult
  var base=Math.pow(4,G.era)* (1+G.tier);
  return Math.max(1,Math.floor(base*tapMult()));
}

/* total "国力" used for era progress = weighted sum of lifetime gold-ish */
function powerScore(){
  var r=G.res;
  return r.gold + r.goods*0.5 + r.food*0.3 + r.qi*5 + r.tech*8 + r.star*20
    + (r.gene||0)*60 + (r.time||0)*180 + (r.dark||0)*520 + (r.mind||0)*1400 + (r.origin||0)*4000 + (r.dao||0)*12000
    + Object.keys(G.buildings).reduce(function(s,id){return s+G.buildings[id]*50;},0);
}
function syncPeakPower(){
  var s=powerScore();
  if(!G.peakPower||s>G.peakPower)G.peakPower=s;
}
function eraScore(){
  return Math.max(G.peakPower||0, powerScore());
}

/* army battle power: scales with buildings + all multipliers (so every system feeds combat) */
function armyPower(){
  var b=0;
  BUILDINGS.forEach(function(x){b+=bCount(x.id)*(x.res==="gold"?2:1)*x.prod;});
  // barracks/sect/factory weigh more as "military"
  b+=bCount("barrack")*8+bCount("sect")*50+bCount("factory")*200+bCount("dyson")*2000;
  b+=bCount("gene_lab")*450+bCount("archive")*800+bCount("chronicle")*1600+bCount("darkwell")*3200+bCount("mindcloud")*6400;
  var beastBonus=0;for(var id in G.beasts){var bb=BEASTS.find(function(z){return z.id===id;});if(bb)beastBonus+=bb.mult*Math.min(G.beasts[id],5);}
  var mult=globalMult("gold")*(1+beastBonus)*REALMS[G.realm].mult;
  return Math.floor((10+b)*mult);
}
function expeditionFoodCost(d){
  return Math.max(20,Math.floor(d.power*0.08));
}

var curTab="build";
function renderEra(){
  syncPeakPower();
  var era=ERAS[G.era];
  $("era-em").textContent=era.em;
  $("era-name").textContent=eraName(G.era);
  $("era-tier").textContent=tierName(G.era,Math.min(G.tier,era.tiers.length-1));
  var prog=clamp(eraScore()/era.need,0,1);
  $("era-fill").style.width=(prog*100).toFixed(1)+"%";
  $("era-prog-txt").textContent=Math.floor(prog*100)+"%";
  // tier within era based on progress
  var newTier=Math.min(era.tiers.length-1,Math.floor(prog*era.tiers.length));
  if(newTier>G.tier){G.tier=newTier;toast(T("civ.ui.tide_advance",{tier:tierName(G.era,newTier)}));beep(700,.1,"sine",.14);}
  // advance button
  var canAdvance = prog>=1 && G.era<ERAS.length-1;
  $("btn-advance").style.display=canAdvance?"block":"none";
  if(canAdvance)$("btn-advance").textContent=T("civ.ui.advance_to",{name:eraName(G.era+1)});
  // fusion note
  $("fusion-note").textContent=fusionNote(G.era);
}

function renderTabs(){

var rankCache=null, rankLoading=false;
function renderRank(body,title){
  title.textContent=T("civ.rank_panel");
  var myPower=eraScore();
  var LB=window.WukongLeaderboard;
  // header: my power + nickname + submit
  var head=document.createElement("div");head.className="ds";head.style.cssText="margin-bottom:10px;color:var(--muted)";
  head.innerHTML=T("civ.rank_note",{power:fmt(myPower)});
  body.appendChild(head);

  var nick=LB?LB.nickname():"";
  var submitAllowed=!!(LB&&LB.canSubmit&&LB.canSubmit());
  var submitTitle=submitAllowed?T("civ.rank_submit"):T("civ.rank_submit_local_disabled");
  var row=document.createElement("div");row.style.cssText="display:flex;gap:8px;margin-bottom:12px";
  row.innerHTML='<input id="rk-nick" maxlength="16" placeholder="'+T("civ.rank_nick_ph")+'" value="'+(nick||"").replace(/"/g,"")+'" '+
      'style="flex:1;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px;outline:none">'+
      '<button class="buy special" id="rk-submit"'+(submitAllowed?'':' disabled')+'>'+submitTitle+'</button>';
  body.appendChild(row);
  if(LB&&!submitAllowed){
    var guard=document.createElement("div");guard.className="ds";guard.style.cssText="margin:-4px 0 12px;color:var(--muted)";
    guard.textContent=T("civ.rank_local_note");
    body.appendChild(guard);
  }

  var listWrap=document.createElement("div");listWrap.id="rk-list";listWrap.className="list";
  listWrap.innerHTML='<div class="ds" style="text-align:center;padding:20px;color:var(--muted)">'+T("civ.rank_loading")+'</div>';
  body.appendChild(listWrap);

  $("rk-submit").onclick=function(){
    if(!LB){toast(T("civ.rank_offline"));return;}
    if(LB.canSubmit&&!LB.canSubmit()){toast(T("civ.rank_local_toast"));return;}
    var n=($("rk-nick").value||"").trim();
    if(!n){toast(T("civ.rank_need_nick"));return;}
    LB.setNickname(n);
    $("rk-submit").disabled=true;
    LB.submit({name:n,score:myPower,era:G.era}).then(function(){
      toast(T("civ.rank_submitted"));beep(720,.1,"sine",.16,160);
      rankCache=null;loadRankList(listWrap);
      $("rk-submit").disabled=false;
    }).catch(function(){
      toast(T("civ.rank_offline"));$("rk-submit").disabled=false;
    });
  };

  loadRankList(listWrap);
}
function loadRankList(wrap){
  var LB=window.WukongLeaderboard;
  if(!LB){wrap.innerHTML='<div class="ds" style="text-align:center;padding:20px;color:var(--bad)">'+T("civ.rank_offline")+'</div>';return;}
  if(rankCache){return paintRank(wrap,rankCache);}
  LB.top({limit:100}).then(function(rows){
    rankCache=LB.dedupeBest(rows).slice(0,100);
    paintRank(wrap,rankCache);
  }).catch(function(){
    wrap.innerHTML='<div class="ds" style="text-align:center;padding:20px;color:var(--bad)">'+T("civ.rank_offline")+'</div>';
  });
}
function paintRank(wrap,rows){
  var LB=window.WukongLeaderboard;
  var myPid=LB?LB.playerId():"";
  var myPower=eraScore();
  if(!rows.length){
    wrap.innerHTML='<div class="ds" style="text-align:center;padding:20px;color:var(--muted)">'+T("civ.rank_empty")+'</div>';
    return;
  }
  // compute my rank among global (by power, even if not submitted)
  var better=0;rows.forEach(function(r){if(r.score>myPower)better++;});
  var myRank=better+1;
  var html='<div class="ds" style="text-align:center;margin-bottom:8px;color:var(--accent)">'+T("civ.rank_mine",{rank:myRank,power:fmt(myPower)})+'</div>';
  rows.forEach(function(r,i){
    var medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":("#"+(i+1));
    var mine=(r.player_id===myPid)?' style="border-color:var(--accent);box-shadow:0 0 10px rgba(255,205,76,.25)"':'';
    var eraNm=eraName(r.era||0);
    html+='<div class="item"'+mine+'>'+
      '<div class="ico" style="font-size:18px;min-width:34px">'+medal+'</div>'+
      '<div><div class="nm">'+escapeHtml(r.name)+'</div><div class="ds">'+eraNm+'</div></div>'+
      '<div style="font-weight:900;color:var(--accent)">'+fmt(r.score)+'</div></div>';
  });
  wrap.innerHTML=html;
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function beastEggCost(){return Math.floor(2e5*Math.pow(1.5, totalBeasts()));}
function totalBeasts(){var t=0;for(var k in G.beasts)t+=G.beasts[k];return t;}

function renderAll(){renderEra();renderRes();renderTabs();renderPanel();}

/* ============ actions ============ */
function buyBuilding(id){
  var b=BUILDINGS.find(function(x){return x.id===id;});
  var cost=buildingCost(b);
  if(!payCost(cost))return;
  G.buildings[id]=bCount(id)+1;
  beep(560,.05,"sine",.1);
  renderRes();renderPanel();renderEra();save();
}
function recruitZodiac(id){
  if(G.zodiacRecruited[id])return;
  var cost=20000;if(G.res.gold<cost)return;
  G.res.gold-=cost;G.zodiacRecruited[id]=true;
  if(!G.bloodline)G.bloodline=id;
  var z=ZODIAC.find(function(x){return x.id===id;});
  toast(zName(id));beep(660,.08,"sine",.12);
  renderAll();save();
}
function setBlood(id){
  if(!G.zodiacRecruited[id])return;
  G.bloodline=id;
  var z=ZODIAC.find(function(x){return x.id===id;});
  toast(zName(id));beep(720,.08,"sine",.13);
  renderAll();save();
}
function hatchEgg(){
  var cost=beastEggCost();if(G.res.gold<cost)return;
  G.res.gold-=cost;
  var roll=Math.random();var pool;
  if(roll<0.02)pool=BEASTS.filter(function(b){return b.rar==="神话";});
  else if(roll<0.25)pool=BEASTS.filter(function(b){return b.rar==="传说";});
  else pool=BEASTS.filter(function(b){return b.rar==="史诗";});
  if(!pool.length)pool=BEASTS;
  var b=pick(pool);
  G.beasts[b.id]=(G.beasts[b.id]||0)+1;
  var isNew=G.beasts[b.id]===1;
  showModal(T("civ.ui.egg_hatch_title"),"<div style='font-size:64px'>"+b.ico+"</div><b style='font-size:22px;color:var(--accent)'>"+beastName(b.id)+"</b><br>"+rarName(rarKey(b.rar))+(isNew?" · "+T("civ.ui.egg_new"):" · ×"+G.beasts[b.id])+"<br>"+T("civ.ui.all_prod_x",{mult:"1+"})+" +"+Math.round(b.mult*100)+"%",
    [{t:T("civ.ui.great"),cls:"btn",fn:closeModal}]);
  beep(b.rar==="神话"?990:b.rar==="传说"?820:600,.16,"sine",.16);
  renderAll();save();
}
function breakRealm(i){
  var r=REALMS[i];if(G.realm!==i-1||G.res.qi<r.cost)return;
  G.res.qi-=r.cost;G.realm=i;
  toast(T("civ.ui.realm_breakthrough",{name:realmName(r.id),mult:r.mult}));beep(840,.14,"sine",.16);
  renderAll();save();
}
function buyTech(id){
  var t=TECHS.find(function(x){return x.id===id;});
  if(G.techs[id]||G.res.tech<t.cost)return;
  G.res.tech-=t.cost;G.techs[id]=true;
  toast(T("civ.ui.research_done",{name:techName(id)}));beep(700,.1,"sine",.14);
  renderAll();save();
}
function buyStar(id){
  var p=STARPROJ.find(function(x){return x.id===id;});
  if(G.starProj[id]||G.res.star<p.cost)return;
  G.res.star-=p.cost;G.starProj[id]=true;
  toast(T("civ.ui.built_done",{name:starName(id)}));beep(760,.12,"sine",.15);
  if(id==="galaxy")setTimeout(winModal,400);
  renderAll();save();
}
function buyEvolution(id){
  var ev=EVOLUTIONS.find(function(x){return x.id===id;});if(!ev||G.evolutions[id])return;
  var unlocked=ev.type==="zodiac"?!!G.zodiacRecruited[ev.target]:(G.beasts[ev.target]||0)>0;
  if(!unlocked||G.res.gene<ev.cost)return;

/* ===== expeditions ===== */
function startExpedition(id){
  if(G.expedition)return;
  var d=DUNGEONS.find(function(x){return x.id===id;});if(!d)return;
  var foodCost=expeditionFoodCost(d);if(G.res.food<foodCost)return;
  G.res.food-=foodCost;
  var ap=armyPower();
  var ratio=ap/d.power;
  var winRate=clamp(ratio>=1?0.6+0.35*Math.min(1,(ratio-1)):0.6*ratio,0.02,0.97);
  G.expedition={id:id,endAt:Date.now()+d.dur*1000,win:Math.random()<winRate};
  toast(T("civ.ui.expedition_start",{name:dunName(id)}));beep(440,.1,"sawtooth",.12);
  renderTabs();renderPanel();save();
}
function resolveExpedition(){
  if(!G.expedition||Date.now()<G.expedition.endAt)return;
  var d=DUNGEONS.find(function(x){return x.id===G.expedition.id;});
  var win=G.expedition.win;
  G.expedition=null;
  if(!d){renderAll();return;}
  if(win){
    G.dungeonWins[d.id]=(G.dungeonWins[d.id]||0)+1;
    var lines=[];
    for(var k in d.reward){G.res[k]+=d.reward[k];var r=RES.find(function(x){return x.key===k;});lines.push(r.ico+fmt(d.reward[k]));}
    var gotEgg=false;
    if(d.egg&&Math.random()<d.egg&&G.era>=2){
      var pool=BEASTS;var b=pick(pool);G.beasts[b.id]=(G.beasts[b.id]||0)+1;gotEgg=true;
      lines.push("🥚"+beastName(b.id));
    }
    showModal(T("civ.ui.victory_title",{name:dunName(d.id)}),T("civ.ui.victory_body")+"<br><br>"+lines.join("　")+(gotEgg?"<br><br>"+T("civ.ui.victory_egg"):""),
      [{t:T("civ.ui.victory_btn"),cls:"btn",fn:closeModal}]);
    beep(740,.14,"sine",.16);setTimeout(function(){beep(920,.14,"sine",.14);},120);
  }else{
    showModal(T("civ.ui.defeat_title",{name:dunName(d.id)}),T("civ.ui.defeat_body"),
      [{t:T("civ.ui.defeat_btn"),cls:"btn",fn:closeModal}]);
    beep(200,.2,"sawtooth",.14);
  }
  renderAll();save();
}
function advanceEra(){
  if(G.era>=ERAS.length-1)return;
  var era=ERAS[G.era];
  syncPeakPower();
  if(eraScore()<era.need)return;
  G.era++;G.tier=0;G.seenEra[G.era]=true;
  var ne=ERAS[G.era];
  showModal(ne.em+" "+eraName(G.era),eraIntro(G.era),[{t:T("civ.next_era_btn"),cls:"btn",fn:function(){closeModal();}}]);
  beep(520,.12,"sine",.16);setTimeout(function(){beep(780,.16,"sine",.16);},130);
  curTab="build";renderAll();save();
}

function doTap(){
  var v=tapValue();
  G.res.gold+=v;
  floatTap("+"+fmt(v));
  beep(420+Math.random()*60,.03,"square",.06);
  renderRes();renderEra();
}
function floatTap(text){
  var zone=$("tap-core").parentElement;
  var el=document.createElement("div");el.className="float";el.textContent=text;
  el.style.left=(40+Math.random()*40)+"%";el.style.top="20%";
  zone.style.position="relative";zone.appendChild(el);
  setTimeout(function(){el.remove();},900);
}

/* ============ modal ============ */
function showModal(title,html,buttons){
  var m=$("modal");
  m.innerHTML="<h2>"+title+"</h2><p>"+html+"</p>";
  (buttons||[]).forEach(function(b){
    var btn=document.createElement("button");btn.className=b.cls||"btn";btn.textContent=b.t;btn.onclick=b.fn;
    m.appendChild(btn);
  });
  $("overlay").classList.add("on");
}
function closeModal(){$("overlay").classList.remove("on");}
function winModal(){
  showModal(T("civ.win_title"),T("civ.win_body"),
    [{t:T("civ.win_continue"),cls:"btn",fn:closeModal}]);
}

/* ============ loop & offline ============ */
var acc=0,lastTick=performance.now();
function tick(now){
  var dt=(now-lastTick)/1000;lastTick=now;
  var prod=prodPerSec();
  for(var k in prod)G.res[k]+=prod[k]*dt;
  if(G.expedition&&Date.now()>=G.expedition.endAt)resolveExpedition();
  acc+=dt;
  if(acc>=0.3){acc=0;renderRes();renderEra();if(curTab==="war")renderPanel();}
  requestAnimationFrame(tick);
}
function applyOffline(){
  var dt=Math.max(0,(Date.now()-(G.last||Date.now()))/1000);
  if(dt<60)return;
  var capped=Math.min(dt,8*3600);
  var prod=prodPerSec();var eff=offlineMult();
  var gained={};var any=false;
  for(var k in prod){var g=prod[k]*capped*eff;if(g>=1){G.res[k]+=g;gained[k]=g;any=true;}}
  if(any){
    var lines=RES.filter(function(r){return gained[r.key];}).map(function(r){return r.ico+" "+fmt(gained[r.key]);}).join("　");
    showModal("🏰 "+T("common.offline_income"),T("civ.offline_desc",{min:Math.floor(dt/60)})+"<br><br>"+lines,
      [{t:T("common.claim"),cls:"btn",fn:closeModal}]);
  }
}

/* ============ wiring ============ */
$("tap-core").addEventListener("pointerdown",function(e){e.preventDefault();doTap();});
$("btn-advance").addEventListener("click",advanceEra);
$("panel-body").addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.build)buyBuilding(t.dataset.build);
  else if(t.dataset.recruit)recruitZodiac(t.dataset.recruit);
  else if(t.dataset.blood)setBlood(t.dataset.blood);
  else if(t.dataset.egg)hatchEgg();
  else if(t.dataset.realm)breakRealm(+t.dataset.realm);
  else if(t.dataset.tech)buyTech(t.dataset.tech);
  else if(t.dataset.star)buyStar(t.dataset.star);
  else if(t.dataset.evolve)buyEvolution(t.dataset.evolve);
  else if(t.dataset.war)startExpedition(t.dataset.war);
});
$("btn-reset").addEventListener("click",function(){
  if(!confirm(T("civ.ui.reset_confirm")))return;
  localStorage.removeItem(SAVE);G=freshState();curTab="build";renderAll();toast(T("civ.ui.reset_done"));
});
setInterval(save,5000);
window.addEventListener("beforeunload",save);

/* ============ boot ============ */
G=load()||freshState();
var def=freshState();for(var dk in def){if(G[dk]===undefined)G[dk]=def[dk];}
for(var rk in def.res){if(G.res[rk]===undefined)G.res[rk]=def.res[rk];}
if(!G.evolutions)G.evolutions={};
if(G.peakPower===undefined)G.peakPower=powerScore();
function bootRender(){
  $("tap-hint-label").textContent=T("civ.ui.tap_hint");
  $("foot-save").textContent=T("civ.ui.auto_save");
  $("btn-reset").textContent=T("civ.ui.reset_btn");
  if(window.WukongI18n)WukongI18n.applyDOM();
  renderAll();
}
if(window.WukongI18n){
  WukongI18n.init({packs:['common','civ'],mount:'#lang-switch'}).then(function(){
    bootRender();applyOffline();
  });
  WukongI18n.onChange(bootRender);
}else{
  bootRender();applyOffline();
}
requestAnimationFrame(tick);

})();
</script>
</body>
</html>
