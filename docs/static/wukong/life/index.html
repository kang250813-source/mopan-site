<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a1530" />
<title data-i18n-title="life.title">无限人生 · 人生重开模拟器</title>
<meta name="description" content="无限人生 —— 网页文字人生模拟器。创建角色，分配天赋，经历上百种随机人生事件，做出选择改变命运。" />
<style>
:root{
  --bg:#16132a; --bg2:#1f1b3a; --card:#262145; --card2:#2d2752;
  --line:rgba(255,255,255,.1); --ink:#ece9ff; --muted:#a59ed0;
  --accent:#8b7bff; --accent2:#b78bff; --gold:#ffd45b;
  --money:#ffd45b; --int:#6ab7ff; --charm:#ff7ab8; --stam:#5be08a; --luck:#c08bff;
  --good:#5be08a; --bad:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);
  background:radial-gradient(circle at 50% -10%,#2a2150 0%,#16132a 55%,#0d0a1c 100%);
  background-attachment:fixed;
  min-height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:16px;
  -webkit-user-select:none;user-select:none;
}
.app{width:100%;max-width:560px;display:flex;flex-direction:column;flex:1}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;
  background:linear-gradient(180deg,var(--accent2),var(--accent));font-size:20px;font-weight:900;
  box-shadow:0 4px 0 #4c3da8}
.logo b{font-size:17px;letter-spacing:2px;display:block}
.logo small{font-size:10px;letter-spacing:3px;color:var(--muted)}
.top-link{font-size:13px;color:var(--accent2);border:1px solid var(--line);padding:6px 13px;border-radius:999px;text-decoration:none}

/* card */
.card{background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:20px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.screen{display:none;flex-direction:column;flex:1}
.screen.active{display:flex}

h1.title{font-size:clamp(30px,8vw,46px);text-align:center;font-weight:900;letter-spacing:4px;
  background:linear-gradient(90deg,#9f8bff,#ff8bd0,#ffd45b);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{text-align:center;color:var(--muted);letter-spacing:5px;font-size:12px;margin-top:6px;margin-bottom:6px}
.lead{text-align:center;color:#cfc8f5;font-size:14px;line-height:1.8;margin:14px 0 22px}

/* form */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;letter-spacing:1px}
.input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:13px 15px;font-size:16px;font-family:inherit;outline:none}
.input:focus{border-color:var(--accent)}
.seg{display:flex;gap:8px}
.seg button{flex:1;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--muted);
  border-radius:12px;padding:12px;font-family:inherit;font-size:15px;cursor:pointer;font-weight:700}
.seg button.on{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;border-color:var(--accent)}

/* stat allocator */
.alloc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.alloc-head .pts{font-size:13px;color:var(--muted)}
.alloc-head .pts b{color:var(--gold);font-size:18px}
.stat-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.stat-row .nm{width:60px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.stat-row .dot{width:9px;height:9px;border-radius:50%}
.stat-row .val{width:34px;text-align:center;font-weight:800;font-size:17px}
.stepper{display:flex;gap:6px;margin-left:auto}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:rgba(0,0,0,.3);color:var(--ink);font-size:18px;font-weight:900;cursor:pointer}
.stepper button:active{transform:scale(.9)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}

/* talents */
.talents{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.talent{display:flex;gap:12px;align-items:flex-start;background:rgba(0,0,0,.22);border:1px solid var(--line);
  border-radius:13px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.talent.on{border-color:var(--accent);background:rgba(139,123,255,.16);box-shadow:0 0 14px rgba(139,123,255,.25)}
.talent .ico{font-size:26px;line-height:1}
.talent .tt{font-size:15px;font-weight:800}
.talent .td{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}

/* buttons */
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:18px;font-weight:900;
  letter-spacing:2px;cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;
  box-shadow:0 6px 0 #4c3da8,0 12px 22px rgba(0,0,0,.35);margin-top:8px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #4c3da8}
.btn.ghost{background:transparent;color:var(--accent2);border:1px solid var(--accent);box-shadow:none}
.btn.ghost:active{transform:translateY(2px);box-shadow:none}
.btn.sm{font-size:15px;padding:12px;letter-spacing:1px}

/* play screen */
.stats-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}
.stat-pill{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
.stat-pill .sl{font-size:10px;color:var(--muted);letter-spacing:1px}
.stat-pill .sv{font-size:17px;font-weight:900;margin-top:2px}
.sv.money{color:var(--money)} .sv.int{color:var(--int)} .sv.charm{color:var(--charm)}
.sv.stam{color:var(--stam)} .sv.luck{color:var(--luck)}

.agebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px}
.agebar .age{font-size:15px;font-weight:800}
.agebar .age b{color:var(--gold);font-size:22px}
.agebar .stage{font-size:12px;color:var(--muted);background:rgba(0,0,0,.3);padding:4px 12px;border-radius:999px}

.log{flex:1;overflow-y:auto;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:12px;min-height:220px;max-height:46vh;scroll-behavior:smooth}
.entry{font-size:14px;line-height:1.7;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.06);
  animation:fade .35s ease}
.entry:last-child{border-bottom:none}
.entry .yr{color:var(--accent2);font-weight:800;margin-right:8px}
.entry.good{color:#bff5d4}.entry.bad{color:#ffc7c7}.entry.big{color:var(--gold);font-weight:700}
.entry .delta{font-size:12px;margin-left:6px;opacity:.85}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* choice modal */
.choices{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
.choice{background:linear-gradient(180deg,rgba(70,60,130,.6),rgba(40,34,80,.7));border:1px solid var(--line);
  color:var(--ink);border-radius:13px;padding:13px 15px;font-size:15px;font-family:inherit;cursor:pointer;text-align:left;font-weight:600}
.choice:active{transform:scale(.98)}
.evtext{font-size:15px;line-height:1.7;color:#e3def8;background:rgba(0,0,0,.25);border-radius:12px;
  padding:13px 15px;margin-bottom:12px;border-left:3px solid var(--accent)}

/* summary / end */
.end-stat{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.end-stat b{color:var(--ink)}
.rank{font-size:clamp(40px,12vw,64px);font-weight:900;text-align:center;
  background:linear-gradient(90deg,var(--gold),#ff8bd0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ach-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.ach-chip{font-size:12px;background:rgba(255,212,91,.14);border:1px solid rgba(255,212,91,.4);color:var(--gold);
  padding:5px 11px;border-radius:999px}

/* achievements panel */
.ach-grid{display:grid;grid-template-columns:1fr;gap:8px;max-height:60vh;overflow-y:auto}
.ach-item{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.25);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px}
.ach-item.locked{opacity:.45}
.ach-item .ai-ico{font-size:26px}
.ach-item .ai-nm{font-size:14px;font-weight:800}
.ach-item .ai-ds{font-size:12px;color:var(--muted);margin-top:2px}
.ach-item .ai-tick{margin-left:auto;color:var(--good);font-weight:900}

.row2{display:flex;gap:10px}.row2>*{flex:1}
.muted-link{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
.muted-link a{color:var(--accent2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);
  border:1px solid var(--accent);color:var(--ink);padding:11px 20px;border-radius:999px;font-size:14px;z-index:90;
  box-shadow:0 8px 24px rgba(0,0,0,.5);animation:fade .3s ease}
.toast[hidden]{display:none}
.scroll-tip{text-align:center;font-size:11px;color:var(--muted);margin-bottom:8px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">
      <span class="mark">命</span>
      <span><b data-i18n="life.title">无限人生</b><small>INFINITE LIFE</small></span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="lang-switch"></span>
      <a class="top-link" href="/game/" data-i18n="common.back_hub">← 游戏大厅</a>
    </div>
  </div>

  <!-- ===== START ===== -->
  <section class="screen active card" id="screen-start">
    <h1 class="title" data-i18n="life.title">无限人生</h1>
    <div class="subtitle" data-i18n="life.subtitle">人 生 重 开 模 拟 器</div>
    <p class="lead" data-i18n-html="life.lead">这一世，你会成为谁？<br/>从呱呱坠地到尘归尘土，<br/>每一个选择，都将书写不同的人生。</p>
    <button class="btn" id="btn-new" data-i18n="life.new">投 胎 重 开</button>
    <button class="btn ghost sm" id="btn-continue" style="display:none" data-i18n="life.continue">继续上一世</button>
    <button class="btn ghost sm" id="btn-ach-open" data-i18n="life.ach_open">🏆 成就馆</button>
    <p class="muted-link" id="life-count"></p>
  </section>

  <!-- ===== CREATE ===== -->
  <section class="screen card" id="screen-create">
    <h1 class="title" style="font-size:26px" data-i18n="life.create_title">捏 一 个 人</h1>
    <div class="field">
      <label data-i18n="life.name_label">姓名</label>
      <input class="input" id="in-name" maxlength="12" data-i18n-attr="placeholder:life.name_ph" placeholder="随便取个名字" />
    </div>
    <div class="field">
      <label data-i18n="life.gender_label">性别</label>
      <div class="seg" id="seg-gender">
        <button data-g="male" class="on" data-i18n="life.g_male">👦 男</button>
        <button data-g="female" data-i18n="life.g_female">👧 女</button>
        <button data-g="secret" data-i18n="life.g_secret">🌈 保密</button>
      </div>
    </div>
    <div class="field">
      <div class="alloc-head">
        <label style="margin:0" data-i18n="life.alloc_label">分配天赋点</label>
        <span class="pts"><span data-i18n="life.alloc_left">剩余</span> <b id="pts-left">20</b></span>
      </div>
      <div id="alloc"></div>
    </div>
    <div class="field">
      <label data-i18n="life.talent_label">选择一个天赋（影响一生）</label>
      <div class="talents" id="talents"></div>
    </div>
    <div class="row2">
      <button class="btn ghost sm" id="btn-rand" data-i18n="life.random">🎲 随机</button>
      <button class="btn sm" id="btn-begin" data-i18n="life.begin">开 始 人 生</button>
    </div>
  </section>

  <!-- ===== PLAY ===== -->
  <section class="screen card" id="screen-play">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="agebar">
      <span class="age"><span data-i18n="life.age_label">年龄</span> <b id="age-num">0</b> <span data-i18n="life.age_unit">岁</span></span>
      <span class="stage" id="stage-tag">婴儿</span>
    </div>
    <div class="scroll-tip" id="who-line"></div>
    <div class="log" id="log"></div>
    <div class="choices" id="choices" style="display:none"></div>
    <button class="btn" id="btn-next" data-i18n="life.next_year">活 下 去（+1 岁）</button>
  </section>

  <!-- ===== END ===== -->
  <section class="screen card" id="screen-end">
    <h1 class="title" style="font-size:26px" data-i18n="life.end_title">人 生 落 幕</h1>
    <div class="rank" id="end-rank">C</div>
    <p class="lead" id="end-words" style="margin:6px 0 14px"></p>
    <div id="end-stats"></div>
    <div class="ach-list" id="end-ach"></div>
    <button class="btn" id="btn-again" data-i18n="life.again">再 活 一 次</button>
    <button class="btn ghost sm" id="btn-end-ach" data-i18n="life.end_ach">🏆 查看成就馆</button>
  </section>

  <!-- ===== ACHIEVEMENTS ===== -->
  <section class="screen card" id="screen-ach">
    <h1 class="title" style="font-size:26px" data-i18n="life.ach_title">🏆 成 就 馆</h1>
    <p class="subtitle" id="ach-progress"></p>
    <div class="ach-grid" id="ach-grid" style="margin-top:12px"></div>
    <button class="btn ghost sm" id="btn-ach-back" style="margin-top:14px" data-i18n="life.back">返回</button>
  </section>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/static/wukong/assets/i18n/i18n.js"></script>
<script>
"use strict";
(function(){

/* ============ helpers ============ */
var $=function(id){return document.getElementById(id);};
var T=function(k,v){return (window.WukongI18n?window.WukongI18n.t(k,v):k);};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
var rand=function(a,b){return a+Math.random()*(b-a);};
var irand=function(a,b){return Math.floor(rand(a,b+1));};
var pick=function(arr){return arr[Math.floor(Math.random()*arr.length)];};
var chance=function(p){return Math.random()<p;};

function toast(msg){
  var el=$("toast");el.textContent=msg;el.hidden=false;
  clearTimeout(toast._t);toast._t=setTimeout(function(){el.hidden=true;},2000);
}
function beep(freq,dur,type,vol){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    beep._c=beep._c||new AC();var c=beep._c;if(c.state==="suspended")c.resume();
    var t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type=type||"sine";o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.12));
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+(dur||.12)+.02);
  }catch(e){}
}

/* ============ static data ============ */
var STATS=[
  {key:"money", name:"金钱", cls:"money", ico:"💰"},
  {key:"int",   name:"智力", cls:"int",   ico:"🧠"},
  {key:"charm", name:"魅力", cls:"charm", ico:"💎"},
  {key:"stam",  name:"体力", cls:"stam",  ico:"💪"},
  {key:"luck",  name:"幸运", cls:"luck",  ico:"🍀"}
];
var STAT_KEYS=["money","int","charm","stam","luck"];

var TALENTS=[
  {id:"genius",  ico:"🧠", name:"天生聪慧", desc:"智力 +3，学业相关事件更顺利。", apply:function(s){s.int+=3;}},
  {id:"beauty",  ico:"💃", name:"倾国倾城", desc:"魅力 +3，感情桃花运更旺。", apply:function(s){s.charm+=3;}},
  {id:"rich",    ico:"🏦", name:"含着金汤匙", desc:"金钱 +4，出身富裕家庭。", apply:function(s){s.money+=4;}},
  {id:"strong",  ico:"🏋️", name:"天赋异禀", desc:"体力 +3，身体硬朗少生病。", apply:function(s){s.stam+=3;}},
  {id:"lucky",   ico:"🍀", name:"天选之子", desc:"幸运 +4，好事更常降临。", apply:function(s){s.luck+=4;}},
  {id:"balance", ico:"☯️", name:"平平淡淡", desc:"全属性 +1，人生稳健。", apply:function(s){STAT_KEYS.forEach(function(k){s[k]+=1;});}},
  {id:"phoenix", ico:"🔥", name:"涅槃重生", desc:"体力低于 0 时有机会绝处逢生。", apply:function(){}},
  {id:"hidden",  ico:"🐲", name:"扮猪吃虎", desc:"幸运 +2，重大机遇出现概率更高。", apply:function(s){s.luck+=2;}}
];

var STAGES=[
  {min:0, max:2,  tag:"婴儿", id:"baby"},
  {min:3, max:5,  tag:"幼儿", id:"toddler"},
  {min:6, max:11, tag:"童年", id:"child"},
  {min:12,max:17, tag:"少年", id:"teen"},
  {min:18,max:22, tag:"青年", id:"youth"},
  {min:23,max:39, tag:"成年", id:"adult"},
  {min:40,max:59, tag:"中年", id:"midlife"},
  {min:60,max:200,tag:"暮年", id:"elder"}
];
function stageOf(age){
  for(var i=0;i<STAGES.length;i++) if(age>=STAGES[i].min&&age<=STAGES[i].max) return T("life.stage."+STAGES[i].id);
  return T("life.stage.elder");
}
/* localized stat/talent name accessors */
function statName(k){return T("life.stat."+k);}
function talentName(id){return T("life.talent."+id+"_n");}
function talentDesc(id){return T("life.talent."+id+"_d");}
function achName(id){return T("life.ach."+id+"_n");}
function achDesc(id){return T("life.ach."+id+"_d");}

/* ============ events DB (100+) ============
   event: {id, min, max, w(weight), once, cond(s), kind, text, eff{stat:delta}, choices:[{t,eff,text,kind}]}
   text/eff can use stat deltas. choices override auto-eff.
*/
function E(min,max,kind,text,eff,opt){
  opt=opt||{};
  return {min:min,max:max,kind:kind,text:text,eff:eff||{},
          w:opt.w||1, once:opt.once||false, cond:opt.cond||null, choices:opt.choices||null, id:opt.id||null};
}

var EVENTS=[
  /* ---- 婴儿 0-2 ---- */
  E(0,0,"big","你出生了，来到这个世界第一声啼哭响彻产房。",{}),
  E(0,2,"good","你长得粉雕玉琢，亲戚们都来逗你笑。",{charm:1}),
  E(0,2,"good","你很早就会翻身，家人惊呼是个机灵鬼。",{int:1}),
  E(0,2,"bad","你半夜哭闹不止，全家都没睡好。",{stam:-1}),
  E(0,2,"normal","你学会了走路，跌跌撞撞扑进妈妈怀里。",{stam:1}),
  E(0,2,"bad","你发了一场高烧，住了几天院。",{stam:-1,money:-1}),
  E(0,2,"good","抓周时你一把抓起了算盘。",{money:1,int:1}),
  E(0,2,"normal","你说出了人生第一个词：『钱』，全家哭笑不得。",{}),
  E(1,2,"good","你被选为小区里最可爱宝宝。",{charm:1,luck:1}),

  /* ---- 幼儿 3-5 ---- */
  E(3,5,"good","幼儿园里你是孩子王，大家都听你的。",{charm:1}),
  E(3,5,"normal","你迷上了动画片，一看就是一整天。",{int:-1,stam:-1}),
  E(3,5,"good","你在才艺表演上背了首唐诗，赢得满堂彩。",{int:1,charm:1}),
  E(3,5,"bad","你和小朋友抢玩具打了一架，鼻青脸肿。",{stam:-1,charm:-1}),
  E(3,5,"good","你帮老师收拾教室，被表扬为好孩子。",{charm:1}),
  E(3,5,"normal","你养了一只蜗牛当宠物，给它取名『大圣』。",{}),

  E(16,200,"good","你偶然捡到一本无名笔记，里面似有玄机，你？",{},{choices:[
    {t:"潜心钻研",eff:{int:2,luck:1},kind:"big",cond:function(s){return s.int>=7;}},
    {t:"上交相关部门",eff:{charm:1,luck:1}},
    {t:"随手丢一边",eff:{}}
  ]})
];

/* ============ event i18n bridge ============
   Each event/choice gets a stable id; the inline Chinese is the zh-CN source and
   the en-US fallback when no translation exists, so text always resolves (never a raw key).
   Translations live under life.ev.<id> / life.ch.<id> (option text under life.chq.<id>.<n>). */
function evText(ev){
  var v = T("life.ev." + ev.id);
  return v === ("life.ev." + ev.id) ? ev.text : v;
}
function choiceQuestion(ev){
  var v = T("life.chq." + ev.id);
  return v === ("life.chq." + ev.id) ? ev.text : v;
}
function choiceOpt(ev, idx, fallback){
  var key = "life.cho." + ev.id + "." + idx;
  var v = T(key);
  return v === key ? fallback : v;
}
(function assignEventIds(){
  EVENTS.forEach(function(ev,i){ ev.id = "e" + i; });
  CHOICE_EVENTS.forEach(function(ev,i){ ev.id = "c" + i; });
})();

/* ============ achievements ============ */
var ACHIEVEMENTS=[
  {id:"first",   ico:"🐣", name:"初来乍到", desc:"完成第一次人生。"},
  {id:"longevity",ico:"🧓",name:"寿比南山", desc:"活到 80 岁以上。"},
  {id:"rich",    ico:"💰", name:"富甲一方", desc:"金钱达到 25 以上。"},
  {id:"genius",  ico:"🧠", name:"绝世天才", desc:"智力达到 20 以上。"},
  {id:"star",    ico:"🌟", name:"万人迷",   desc:"魅力达到 20 以上。"},
  {id:"iron",    ico:"🦾", name:"铁人",     desc:"体力达到 20 以上。"},
  {id:"lucky",   ico:"🍀", name:"欧皇附体", desc:"幸运达到 20 以上。"},
  {id:"perfect", ico:"👑", name:"完美人生", desc:"以 SSS 评级结束一生。"},
  {id:"tragic",  ico:"💀", name:"天妒英才", desc:"未满 18 岁便英年早逝。"},
  {id:"balanced",ico:"☯️", name:"五维均衡", desc:"结束时五项属性均不低于 12。"},
  {id:"reborn",  ico:"🔄", name:"轮回十世", desc:"累计重开 10 次。"},
  {id:"phoenix", ico:"🔥", name:"绝处逢生", desc:"触发涅槃天赋起死回生。"}
];

/* ============ persistence ============ */
var SAVE_KEY="infinite-life-save";
var META_KEY="infinite-life-meta";

function loadMeta(){
  try{return JSON.parse(localStorage.getItem(META_KEY))||{ach:{},lives:0};}
  catch(e){return {ach:{},lives:0};}
}
function saveMeta(){localStorage.setItem(META_KEY,JSON.stringify(meta));}
function unlockAch(id){
  if(meta.ach[id])return false;
  meta.ach[id]=true;saveMeta();
  var a=ACHIEVEMENTS.find(function(x){return x.id===id;});
  if(a){toast(T("life.ach_done",{name:achName(a.id)}));beep(880,.12,"sine",.16);newlyUnlocked.push(a);}
  return true;
}

function saveGame(){
  if(!G||G.dead)return;
  localStorage.setItem(SAVE_KEY,JSON.stringify(G));
}
function clearSave(){localStorage.removeItem(SAVE_KEY);}
function loadGame(){
  try{return JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return null;}
}

/* ============ game state ============ */
var meta=loadMeta();
var G=null;
var newlyUnlocked=[];
var pendingChoice=false;

/* ============ screen nav ============ */
function show(id){
  ["start","create","play","end","ach"].forEach(function(s){
    $("screen-"+s).classList.toggle("active",s===id);
  });
  window.scrollTo(0,0);
}

/* ============ create character ============ */
var create={gender:"male",talent:null,pts:20,stats:{money:0,int:0,charm:0,stam:0,luck:0}};
var BASE=3, ALLOC_POOL=20, MAXSTAT=10;

function renderAlloc(){
  var box=$("alloc");box.innerHTML="";
  STATS.forEach(function(st){
    var v=create.stats[st.key];
    var row=document.createElement("div");
    row.className="stat-row";
    row.innerHTML=
      '<span class="nm"><span class="dot" style="background:var(--'+st.cls+')"></span>'+statName(st.key)+'</span>'+
      '<span class="val" style="color:var(--'+st.cls+')">'+(BASE+v)+'</span>'+
      '<span class="stepper">'+
        '<button data-dec="'+st.key+'"'+(v<=0?' disabled':'')+'>−</button>'+
        '<button data-inc="'+st.key+'"'+(create.pts<=0||BASE+v>=MAXSTAT?' disabled':'')+'>+</button>'+
      '</span>';
    box.appendChild(row);
  });
  $("pts-left").textContent=create.pts;
}
function renderTalents(){
  var box=$("talents");box.innerHTML="";
  TALENTS.forEach(function(t){
    var el=document.createElement("div");
    el.className="talent"+(create.talent===t.id?" on":"");
    el.dataset.talent=t.id;
    el.innerHTML='<span class="ico">'+t.ico+'</span><div><div class="tt">'+talentName(t.id)+'</div><div class="td">'+talentDesc(t.id)+'</div></div>';
    box.appendChild(el);
  });
}
function resetCreate(){
  create={gender:"male",talent:null,pts:ALLOC_POOL,stats:{money:0,int:0,charm:0,stam:0,luck:0}};
  $("in-name").value="";
  Array.prototype.forEach.call($("seg-gender").children,function(b,i){b.classList.toggle("on",i===0);});
  renderAlloc();renderTalents();
}

$("alloc").addEventListener("click",function(e){
  var inc=e.target.getAttribute("data-inc"),dec=e.target.getAttribute("data-dec");
  if(inc&&create.pts>0&&BASE+create.stats[inc]<MAXSTAT){create.stats[inc]++;create.pts--;beep(520,.04,"square",.08);}
  if(dec&&create.stats[dec]>0){create.stats[dec]--;create.pts++;beep(380,.04,"square",.06);}
  renderAlloc();
});
$("seg-gender").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  create.gender=b.getAttribute("data-g");
  Array.prototype.forEach.call(this.children,function(x){x.classList.remove("on");});
  b.classList.add("on");
});
$("talents").addEventListener("click",function(e){
  var el=e.target.closest(".talent");if(!el)return;
  create.talent=el.dataset.talent;renderTalents();beep(600,.06,"sine",.1);
});
$("btn-rand").addEventListener("click",function(){
  // random allocation
  create.stats={money:0,int:0,charm:0,stam:0,luck:0};create.pts=ALLOC_POOL;
  while(create.pts>0){
    var k=pick(STAT_KEYS);
    if(BASE+create.stats[k]<MAXSTAT){create.stats[k]++;create.pts--;}
    else if(STAT_KEYS.every(function(x){return BASE+create.stats[x]>=MAXSTAT;}))break;
  }
  create.talent=pick(TALENTS).id;
  create.gender=pick(["male","female","secret"]);
  Array.prototype.forEach.call($("seg-gender").children,function(b){
    b.classList.toggle("on",b.getAttribute("data-g")===create.gender);
  });
  if(!$("in-name").value)$("in-name").value=pick(T("life.rand_names").split(","));
  renderAlloc();renderTalents();beep(700,.08,"sine",.12);
});

/* ============ begin life ============ */
function begin(){
  var name=($("in-name").value||T("life.default_name")).trim().slice(0,12);
  var talent=TALENTS.find(function(t){return t.id===create.talent;})||TALENTS[5];
  var s={};STAT_KEYS.forEach(function(k){s[k]=BASE+create.stats[k];});
  talent.apply(s);
  STAT_KEYS.forEach(function(k){s[k]=clamp(s[k],0,99);});
  G={
    name:name, gender:create.gender, talentId:talent.id, talentName:talent.name,
    age:0, dead:false,
    money:s.money, int:s.int, charm:s.charm, stam:s.stam, luck:s.luck,
    log:[], usedOnce:{}, phoenixUsed:false
  };
  newlyUnlocked=[];
  pendingChoice=false;
  show("play");
  renderStats();renderWho();
  $("log").innerHTML="";
  pushLog(0,"big",T("life.born",{name:G.name}),{});
  // talent line
  pushLog(0,"normal",T("life.talent_line",{name:talentName(talent.id),desc:talentDesc(talent.id)}),{});
  $("choices").style.display="none";
  $("btn-next").style.display="block";
  saveGame();
}

/* ============ stats render ============ */
function renderStats(){
  var bar=$("stats-bar");bar.innerHTML="";
  STATS.forEach(function(st){
    var v=G[st.key];
    var d=document.createElement("div");
    d.className="stat-pill";
    d.innerHTML='<div class="sl">'+st.ico+' '+statName(st.key)+'</div><div class="sv '+st.cls+'">'+v+'</div>';
    bar.appendChild(d);
  });
  $("age-num").textContent=G.age;
  $("stage-tag").textContent=stageOf(G.age);
}
function renderWho(){
  var gtag=G.gender==="male"?"♂":G.gender==="female"?"♀":"⚧";
  $("who-line").textContent=T("life.who_line",{name:G.name,g:gtag,talent:talentName(G.talentId)});
}

/* ============ log ============ */
function pushLog(age,kind,text,eff){
  var parts=[];
  for(var k in eff){if(!eff[k])continue;
    var st=STATS.find(function(x){return x.key===k;});
    parts.push((eff[k]>0?"+":"")+eff[k]+st.ico);
  }
  var deltaStr=parts.length?'<span class="delta">'+parts.join(" ")+'</span>':"";
  var div=document.createElement("div");
  div.className="entry "+(kind||"normal");
  div.innerHTML='<span class="yr">'+age+'岁</span>'+text+deltaStr;
  $("log").appendChild(div);
  $("log").scrollTop=$("log").scrollHeight;
}

/* ============ apply effect ============ */
function applyEff(eff){
  for(var k in eff){
    if(STAT_KEYS.indexOf(k)<0)continue;
    G[k]=G[k]+eff[k];
    if(k!=="money") G[k]=clamp(G[k],0,99); // money can't go negative below 0 either
    if(G[k]<0)G[k]=0;
  }
}

/* ============ pick an event ============ */
function eligible(list){
  return list.filter(function(ev){
    if(G.age<ev.min||G.age>ev.max)return false;
    if(ev.once&&G.usedOnce[ev.text])return false;
    if(ev.cond){var s={};STAT_KEYS.forEach(function(k){s[k]=G[k];});s.age=G.age;if(!ev.cond(s))return false;}
    return true;
  });
}
function weightedPick(list){
  var total=0;list.forEach(function(e){total+=(e.w||1)*(1+(G.luck>=8&&e.kind==="good"?0.6:0));});
  var r=Math.random()*total;
  for(var i=0;i<list.length;i++){
    r-=(list[i].w||1)*(1+(G.luck>=8&&list[i].kind==="good"?0.6:0));
    if(r<=0)return list[i];
  }
  return list[list.length-1];
}

/* ============ advance one year ============ */
function nextYear(){
  if(G.dead||pendingChoice)return;
  G.age++;
  renderStats();

  // chance for a choice event (rises with age stages), else auto event
  var choicePool=eligible(CHOICE_EVENTS);
  var autoPool=eligible(EVENTS);
  var useChoice=choicePool.length && chance(0.32);

  if(useChoice){
    presentChoice(weightedPick(choicePool));
  }else if(autoPool.length){
    var ev=weightedPick(autoPool);
    if(ev.once)G.usedOnce[ev.text]=true;
    applyEff(ev.eff);
    pushLog(G.age,ev.kind,evText(ev),ev.eff);
    if(ev.kind==="good")beep(660,.06,"sine",.1);
    else if(ev.kind==="bad")beep(220,.08,"sawtooth",.1);
    else if(ev.kind==="big")beep(520,.1,"sine",.14);
    afterEvent();
  }else{
    pushLog(G.age,"normal",T("life.peaceful_year"),{});
    afterEvent();
  }
}

function afterEvent(){
  renderStats();
  checkLiveAchievements();
  // death check
  var dieRisk=deathRisk();
  if(G.stam<=0){
    if(G.talentId==="phoenix"&&!G.phoenixUsed&&chance(0.6)){
      G.phoenixUsed=true;G.stam=5;
      pushLog(G.age,"big",T("life.death.phoenix"),{stam:5});
      unlockAch("phoenix");
    }else{
      return die(T("life.death.stam"));
    }
  }
  if(chance(dieRisk)){
    return die(naturalDeathText());
  }
  saveGame();
}

function deathRisk(){
  var base=0;
  if(G.age>=60)base=0.04+(G.age-60)*0.015;
  else if(G.age>=40)base=0.01;
  else base=0.004;
  // low stamina raises risk
  if(G.stam<=2)base+=0.08;
  // luck reduces
  base-=G.luck*0.002;
  return clamp(base,0,0.9);
}
function naturalDeathText(){
  if(G.age>=80)return T("life.death.old");
  if(G.age>=60)return T("life.death.senior");
  if(G.age>=40)return T("life.death.mid");
  return T("life.death.young");
}

/* ============ choice events ============ */
function presentChoice(ev){
  pendingChoice=true;
  var box=$("choices");box.innerHTML="";
  var banner=document.createElement("div");
  banner.className="evtext";banner.textContent="❓ "+choiceQuestion(ev);
  box.appendChild(banner);
  var opts=ev.choices.filter(function(c){
    if(!c.cond)return true;
    var s={};STAT_KEYS.forEach(function(k){s[k]=G[k];});s.age=G.age;
    return c.cond(s);
  });
  if(!opts.length)opts=ev.choices;
  opts.forEach(function(c){
    var oi=ev.choices.indexOf(c);
    var btn=document.createElement("button");
    btn.className="choice";
    btn.textContent="› "+choiceOpt(ev,oi,c.t);
    btn.onclick=function(){chooseOption(ev,c,oi);};
    box.appendChild(btn);
  });
  box.style.display="flex";
  $("btn-next").style.display="none";
  beep(500,.08,"sine",.12);
}
function chooseOption(ev,c,oi){
  pendingChoice=false;
  $("choices").style.display="none";
  $("choices").innerHTML="";
  $("btn-next").style.display="block";
  applyEff(c.eff);
  var sc=scoreEff(c.eff);
  var kind=c.kind||(sc>0?"good":sc<0?"bad":"normal");
  pushLog(G.age,kind,T("life.choose_prefix",{t:choiceOpt(ev,oi,c.t)}),c.eff);
  beep(kind==="bad"?240:640,.07,kind==="bad"?"sawtooth":"sine",.1);
  afterEvent();
}
function scoreEff(eff){var t=0;for(var k in eff)t+=eff[k];return t;}

/* ============ death & summary ============ */
function die(reason){
  G.dead=true;
  clearSave();
  pushLog(G.age,"big","⚰️ "+reason,{});
  var rankInfo=evaluate();
  unlockAch("first");
  if(G.age>=80)unlockAch("longevity");
  if(G.money>=25)unlockAch("rich");
  if(G.int>=20)unlockAch("genius");
  if(G.charm>=20)unlockAch("star");
  if(G.stam>=20)unlockAch("iron");
  if(G.luck>=20)unlockAch("lucky");
  if(rankInfo.rank==="SSS")unlockAch("perfect");
  if(G.age<18)unlockAch("tragic");
  if(STAT_KEYS.every(function(k){return G[k]>=12;}))unlockAch("balanced");
  meta.lives=(meta.lives||0)+1;
  if(meta.lives>=10)unlockAch("reborn");
  saveMeta();
  setTimeout(function(){renderEnd(rankInfo);show("end");},900);
}

function evaluate(){
  var total=G.money+G.int+G.charm+G.stam+G.luck;
  var score=total+Math.floor(G.age/3);
  var rank;
  if(score>=95)rank="SSS";
  else if(score>=80)rank="SS";
  else if(score>=65)rank="S";
  else if(score>=50)rank="A";
  else if(score>=38)rank="B";
  else if(score>=26)rank="C";
  else rank="D";
  return {rank:rank,words:T("life.rank."+rank),score:score,total:total};
}

function renderEnd(info){
  $("end-rank").textContent=info.rank;
  $("end-words").textContent=info.words;
  var box=$("end-stats");box.innerHTML="";
  function row(l,v){var d=document.createElement("div");d.className="end-stat";d.innerHTML=l+'<b>'+v+'</b>';box.appendChild(d);}
  row(T("life.end_name"),G.name);
  row(T("life.end_age"),G.age+" "+T("life.age_unit"));
  STATS.forEach(function(st){row(st.ico+" "+statName(st.key),G[st.key]);});
  row(T("life.end_score"),info.score);
  var ach=$("end-ach");ach.innerHTML="";
  if(newlyUnlocked.length){
    var h=document.createElement("div");h.style.cssText="width:100%;text-align:center;color:var(--muted);font-size:12px;margin-bottom:4px";
    h.textContent=T("life.end_unlocked");ach.appendChild(h);
    newlyUnlocked.forEach(function(a){
      var c=document.createElement("span");c.className="ach-chip";c.textContent=a.ico+" "+achName(a.id);ach.appendChild(c);
    });
  }
  beep(info.rank.charAt(0)==="S"?880:520,.16,"sine",.18);
}

function checkLiveAchievements(){
  if(G.money>=25)unlockAch("rich");
  if(G.int>=20)unlockAch("genius");
  if(G.charm>=20)unlockAch("star");
  if(G.stam>=20)unlockAch("iron");
  if(G.luck>=20)unlockAch("lucky");
}

/* ============ achievements panel ============ */
function renderAchPanel(){
  var got=ACHIEVEMENTS.filter(function(a){return meta.ach[a.id];}).length;
  $("ach-progress").textContent=T("life.ach_progress",{got:got,total:ACHIEVEMENTS.length});
  var grid=$("ach-grid");grid.innerHTML="";
  ACHIEVEMENTS.forEach(function(a){
    var on=!!meta.ach[a.id];
    var el=document.createElement("div");
    el.className="ach-item"+(on?"":" locked");
    el.innerHTML='<span class="ai-ico">'+(on?a.ico:"🔒")+'</span>'+
      '<div><div class="ai-nm">'+achName(a.id)+'</div><div class="ai-ds">'+achDesc(a.id)+'</div></div>'+
      (on?'<span class="ai-tick">✓</span>':'');
    grid.appendChild(el);
  });
}

/* ============ start screen ============ */
function refreshStart(){
  var saved=loadGame();
  $("btn-continue").style.display=(saved&&!saved.dead)?"block":"none";
  $("life-count").textContent=meta.lives?T("life.lives_count",{n:meta.lives}):"";
}

/* ============ wiring ============ */
$("btn-new").addEventListener("click",function(){resetCreate();show("create");});
$("btn-continue").addEventListener("click",function(){
  var saved=loadGame();
  if(saved&&!saved.dead){
    G=saved;newlyUnlocked=[];pendingChoice=false;show("play");
    renderStats();renderWho();
    $("log").innerHTML="";
    pushLog(G.age,"normal",T("life.resume_line",{age:G.age}),{});
    $("choices").style.display="none";$("btn-next").style.display="block";
  }else{resetCreate();show("create");}
});
$("btn-begin").addEventListener("click",begin);
$("btn-next").addEventListener("click",function(){beep(440,.04,"square",.07);nextYear();});
$("btn-again").addEventListener("click",function(){resetCreate();show("create");});
$("btn-ach-open").addEventListener("click",function(){renderAchPanel();show("ach");});
$("btn-end-ach").addEventListener("click",function(){renderAchPanel();show("ach");});
$("btn-ach-back").addEventListener("click",function(){refreshStart();show(G&&!G.dead?"play":"start");});

window.addEventListener("keydown",function(e){
  if((e.key===" "||e.key==="Enter")&&$("screen-play").classList.contains("active")&&!pendingChoice){
    e.preventDefault();nextYear();
  }
});

/* ============ boot ============ */
function relocalize(){
  if(window.WukongI18n)WukongI18n.applyDOM();
  // re-render dynamic content for whichever screen is active
  if($("screen-create").classList.contains("active")){renderAlloc();renderTalents();}
  if($("screen-play").classList.contains("active")&&G){renderStats();renderWho();}
  if($("screen-ach").classList.contains("active"))renderAchPanel();
  refreshStart();
}
if(window.WukongI18n){
  WukongI18n.init({packs:['common','life'],mount:'#lang-switch'}).then(function(){
    refreshStart();show("start");
  });
  WukongI18n.onChange(relocalize);
}else{
  refreshStart();
  show("start");
}

})();
</script>
