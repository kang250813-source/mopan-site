{% extends "base.html" %}
{% block title %}登录 - {{ site_title }}{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div class="admin-login">
  <h1>魔盘后台</h1>
  <p class="admin-login-hint">仅限本机访问 · 24 词口令</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>用户名<input name="username" required autocomplete="username"></label>
    <label>口令（24 个英文单词，空格分隔）<textarea name="password" rows="4" required autocomplete="current-password" placeholder="word1 word2 word3 ..."></textarea></label>
    <button type="submit" class="btn btn-primary">登录</button>
  </form>
</div>
{% endblock %}
