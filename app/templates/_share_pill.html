{# Share button — requires share_page_url, share_title; optional share_quark, share_github, share_kind #}
{% set share_kind = share_kind | default('resource') %}
<button
  type="button"
  class="pill pill-share js-share-page"
  data-share-title="{{ share_title }}"
  data-share-page="{{ share_page_url }}"
  data-share-quark="{{ share_quark | default('') }}"
  data-share-github="{{ share_github | default('') }}"
  data-share-kind="{{ share_kind }}"
  aria-label="{{ t('share.aria') }}"
>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10M12 3 8.5 6.5M12 3l3.5 3.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span class="js-share-label">{{ t('share.label') }}</span>
</button>
