{% if item.pan_branches %}
<div class="mp-pan-branches" aria-label="网盘目录">
  {% for branch in item.pan_branches[:10] %}
  <span class="mp-pan-branch">{{ branch }}</span>
  {% endfor %}
  {% if item.pan_branches|length > 10 %}
  <span class="mp-pan-branch mp-pan-branch--more">+{{ item.pan_branches|length - 10 }}</span>
  {% endif %}
</div>
{% endif %}
